- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.config/lazygit
    - ~/.config/shell

- link:
    ~/.zshrc:
      path: .zshrc
      force: true
    ~/.config/nvim:
      path: nvim
    ~/.config/lazygit/config.yml:
      path: lazygit/config.yml
      force: true
    ~/.config/starship.toml:
      path: starship/starship.toml
    ~/.wezterm.lua:
      path: wezterm/.wezterm.lua
    ~/.config/k9s:
      path: k9s
      force: true
    ~/.config/ghostty/config:
      path: ghostty/config
    ~/.config/herdr/config.toml:
      path: herdr/config.toml
    ~/.config/git/hooks:
      path: git-hooks
    ~/.config/mise/config.toml:
      path: mise/config.toml

- shell:
    - touch ~/.config/shell/secrets.env
    - chmod 600 ~/.config/shell/secrets.env
    - git config --global core.hooksPath ~/.config/git/hooks
    - chmod +x ~/.config/git/hooks/post-checkout
