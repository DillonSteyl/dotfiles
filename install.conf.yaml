- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.config/lazygit

- link:
    ~/.config/nvim:
      path: nvim
    ~/.config/lazygit/config.yml:
      path: lazygit/config.yml
      force: true
    ~/.config/starship.toml:
      path: starship/starship.toml
    ~/.wezterm.lua:
      path: wezterm/.wezterm.lua
    ~/.config/k9s/skins/:
      path: k9s/skins
      force: true
    ~/.config/k9s/config.yaml:
      path: k9s/config.yaml
      force: true
    ~/.config/k9s/aliases.yaml:
      path: k9s/aliases.yaml
      force: true
    ~/.config/ghostty/config:
      path: ghostty/config
    ~/.config/herdr/config.toml:
      path: herdr/config.toml
    ~/.config/git/hooks:
      path: git-hooks
    ~/.config/mise/config.toml:
      path: mise/config.toml

- shell:
    - git config --global core.hooksPath ~/.config/git/hooks
    - chmod +x ~/.config/git/hooks/post-checkout
