    fgColor: "#708183" # foreground
    bgColor: default # background
    logoColor: "#268bd2" # solarized blue

  info:
    fgColor: "#839496" # light foreground (approx Solarized base0)
    sectionColor: "#2aa198" # solarized cyan

  frame:
    border:
      fgColor: "#586e75"
      focusColor: "#268bd2"

    menu:
      fgColor: "#93a1a1"
